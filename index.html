<style>
/* Layout: one-screen app. Phones: search on top, map below, directions sheet over the bottom of the map.
   Wide screens: map fills the left from top to bottom, search + results + directions in a right-hand column. */
:root{
  --bg:#ffffff; --fg:#14172a; --muted:#5d6278; --panel:#f3f4f8; --rule:#dfe1ea;
  --ink:#0019a8;            /* station-name blue */
  --roundel:#dc241f;
  --track-black:#000000; --halo:#ffffff; --station-fill:#ffffff; --station-ring:#000000;
  --hit:#dc241f; --left:#0019a8; --right:#b26300;
  --font-display:"Hammersmith One","Gill Sans","Gill Sans MT",Calibri,"Trebuchet MS",sans-serif;  /* the map only */
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1120; --fg:#eef0f7; --muted:#9aa1bb; --panel:#171c30; --rule:#2a3049;
  --ink:#b9c4ff; --track-black:#e6e7ee; --halo:#0d1120; --station-fill:#0d1120; --station-ring:#f4f5fa;
  --hit:#ff5a52; --left:#9fb0ff; --right:#ffb35c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1120; --fg:#eef0f7; --muted:#9aa1bb; --panel:#171c30; --rule:#2a3049;
  --ink:#b9c4ff; --track-black:#e6e7ee; --halo:#0d1120; --station-fill:#0d1120; --station-ring:#f4f5fa;
  --hit:#ff5a52; --left:#9fb0ff; --right:#ffb35c; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{height:100%;display:flex;flex-direction:column;position:relative}
.panel{flex:none;display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--rule);z-index:5;background:var(--bg)}
.panel>.results{margin:0 max(16px,calc((100% - 760px) / 2)) 8px;width:auto}
header{flex:none;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;max-width:760px;width:100%;margin:0 auto}
.roundel{flex:none;width:40px;height:40px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:18px;padding:11px 40px 11px 14px;border:2px solid var(--fg);border-radius:999px;background:var(--bg);color:var(--fg);outline:none}
.search input:focus-visible{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 25%,transparent)}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.clear:hover{background:var(--panel);color:var(--fg)}
.meta{max-width:760px;width:100%;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);min-height:24px}
.chip{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip:hover{border-color:var(--fg)}
.toggle{margin-left:auto;font-weight:500}
@media (max-width:520px){.meta .hint{display:none}}
.toggle::after{content:" ▴"}
.toggle[aria-expanded="false"]::after{content:" ▾"}
.count{font-variant-numeric:tabular-nums;color:var(--fg)}
.results{position:relative;max-width:760px;width:100%;margin:0 auto;max-height:max(130px,calc(50vh - 118px));max-height:max(130px,calc(50dvh - 118px));overflow:auto;overscroll-behavior:contain;border:1px solid var(--rule);border-radius:12px;background:var(--bg)}
.results ol{list-style:none;margin:0;padding:4px 0}
.results li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;width:100%;padding:8px 12px;cursor:pointer}
.results li button:hover,.results li button:focus-visible,.results li button.hot{background:var(--panel)}
.results .sw{width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 2px var(--sw)}
.results .nm{display:block;font-size:16px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .sub{display:block;font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results .pc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.more{padding:8px 12px;color:var(--muted);font-size:13px}
.mapwrap{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:var(--bg)}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
svg#map.drag{cursor:grabbing}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--fg);font:inherit;font-size:20px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoom button:hover{border-color:var(--fg)}
.zoom svg{display:block;margin:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));pointer-events:none}
.card{pointer-events:auto;max-width:640px;margin:0 auto;background:var(--bg);border:2px solid var(--fg);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-height:52vh;overflow:auto}
.cardtop{display:flex;align-items:flex-start;gap:8px}
.x{flex:none;margin:-6px -8px 0 auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--panel);color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.x:hover{background:var(--rule)}
.card h2{margin:0;font-weight:600;font-size:20px;line-height:1.1;color:var(--ink);text-wrap:balance}
.card .where{font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;line-height:1.4}
.dir{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel)}
.side{grid-row:span 2;font-family:var(--font-display);font-size:22px;letter-spacing:.04em;width:92px;text-align:center;padding:8px 0;border-radius:8px;color:var(--bg)}
.side.L{background:var(--left)} .side.R{background:var(--right)}
.dir .head{font-size:14px;color:var(--muted)}
.dir .body{font-size:16px;line-height:1.3}
.dir .body b{font-weight:600;color:var(--ink)}
.note{font-size:13px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:8px}
.navhead{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.navbtns{display:flex;flex-wrap:wrap;gap:6px}
.navbtn{font:inherit;font-size:14px;line-height:1.2;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);text-decoration:none;cursor:pointer;user-select:text}
.navbtn:hover{border-color:var(--fg)}
.navbtn.pref{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.navbtn small{font-size:11px;opacity:.75}
@media (max-width:520px){.search input{font-size:16px;padding:9px 38px 9px 14px}.meta,.chip{font-size:13px}.results .nm{font-size:15px}.results .sub,.results .pc{font-size:12px}.results li button{padding:7px 12px}.card{padding:10px 12px;gap:6px;max-height:46%;border-radius:14px}.card h2{font-size:17px}.card .where,.pill{font-size:13px}.side{width:62px;font-size:15px;padding:6px 0}.dir{padding:7px 8px;gap:2px 10px}.dir .body{font-size:15px}.dir .head{font-size:12px}.note{font-size:12px}}
@media (min-width:860px){
  .app{flex-direction:row}
  .mapwrap{order:1;flex:1}
  .panel{order:2;flex:none;width:clamp(340px,30vw,420px);height:100%;border-bottom:0;border-left:1px solid var(--rule);background:var(--bg);padding-bottom:12px;gap:12px}
  header{border-bottom:0;padding-block:14px 0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .panel>.results{flex:1 1 auto;max-height:none;min-height:0;margin:0 16px;width:auto}
  .toggle{display:none}
  .sheet{position:static;padding:0 16px;pointer-events:auto;flex:0 1 auto;min-height:0;display:flex}
  .sheet[hidden]{display:none!important}
  .card{max-height:100%;box-shadow:none;width:100%}
}
.attrib{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:6px;font-size:11px;color:var(--muted);z-index:2;pointer-events:none}
/* map styling */
.lbl{font-family:var(--font-display);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:5px;stroke-linejoin:round}
.road-tag{font-family:var(--font-display);font-size:15px}
.dim .line,.dim .tick,.dim .lbl{opacity:.35}
.hitdot{cursor:pointer}
.hitdot:hover circle,.hitdot.hot circle{r:9}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

/* ---------- search ---------- */
function norm(s) { return String(s).toLowerCase().replace(/&/g, ' and ').replace(/['’]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function search(q) {

  const toks = nq.split(' '), compact = nq.replace(/ /g, '');
  const out = [];
  for (const r of recs) {
    if (r.icon === 'Sign Post') continue;
    if (!toks.every(t => r.hay.includes(t)) && !(compact.length >= 4 && r.hay.replace(/ /g, '').includes(compact))) continue;
    const L = norm(r.label);
    let sc = 10;
    if (L === nq) sc = 100; else if (L.startsWith(nq)) sc = 80; else if ((' ' + L).includes(' ' + nq)) sc = 60; else if (L.includes(nq)) sc = 40;
    if (r.icon !== 'House') sc -= 3;
    out.push({ r, sc });

  out.sort((a, b) => b.sc - a.sc || a.r.label.localeCompare(b.r.label, 'en', { numeric: true }));

function leg(r, fwd) {

    for (const o of recs) {

      const d0 = (o.s - prev.s) * sgn, d1 = (s - o.s) * sgn;

  const before = L.next ? `before <b>${esc(L.next.name)}</b>` : 'before the end of the road';

/* hand the exact spot to a navigation app, on foot where the app supports it (many of the lanes are footpaths or bridleways) */
const APPS = {

  apple: { name: 'Apple Maps', url: (la, lo) => `https://maps.apple.com/?daddr=${la},${lo}&dirflg=w` },

    + `<button class="navbtn" type="button" id="copyll" data-ll="${la}, ${lo}">Copy location</button></div></div>`;

$card.addEventListener('click', e => {
  const a = e.target.closest('a.navbtn');

  const c = e.target.closest('#copyll');
  if (c) {
    const done = () => { c.textContent = 'Copied ' + c.dataset.ll; };
    try { navigator.clipboard.writeText(c.dataset.ll).then(done, () => { c.textContent = c.dataset.ll; }); } catch (err) { c.textContent = c.dataset.ll; }
  }
});

function renderSel() {
  gSel.innerHTML = ''; gHi.innerHTML = '';

  const r = sel, R = ROADS[r.road];

  const s0 = F.prev ? F.prev.s : 0, s1 = F.next ? F.next.s : R.g.L;

  el('path', { d: dstr(stretch), fill: 'none', stroke: colAt(R, r.s), 'stroke-opacity': 0.32, 'stroke-width': 34, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, gHi);
  // big station marker joined to the road on the correct side
  const p = r.pt, base = at(R.s, R.map(r.s));

  if (r.spur) {
    route = [[base.x, base.y]].concat(slice(r.spur.g, 0, Math.max(1, r.in)).map(P => { const q = r.spur.toSch(P); return [q.x, q.y]; }), [[p.x, p.y]]);

  } else el('line', { x1: base.x, y1: base.y, x2: p.x, y2: p.y, stroke: 'var(--station-ring)', 'stroke-width': 6 }, gSel);

  el('path', { d: 'M0 0C-3 -9 -15 -17 -15 -29A15 15 0 1 1 15 -29C15 -17 3 -9 0 0Z', fill: '#EA4335', stroke: '#A50E0E', 'stroke-width': 2 }, pin);

  const setback = !r.spur && r.off > 55 ? `<div class="note">Set back about ${Math.round(r.off / 10) * 10} m from the road. Look for a driveway.</div>` : '';
  $card.innerHTML = `<div class="cardtop"><h2>${esc(r.label)}</h2><button class="x" type="button" id="x" aria-label="Close directions">×</button></div>
    <div class="where">${pill}<span>${esc(where(r).replace(' of ' + r.roadName, '').replace(', off ' + r.roadName, ''))}</span>${r.pc.startsWith('RH') ? `<span>${esc(r.pc)}</span>` : ''}</div>
    ${legHTML(r, F)}${setback}${navHTML(r)}`;

}

function renderAll() {
  renderMeta(); renderList(); renderDots(); renderSel();
